<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="A slowly animated ASCII pixel-art landscape.">
  <title>GianT404 — Animated ASCII Landscape</title>
  <style>
    :root {
      color-scheme: dark;
      background: #101114;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #101114;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .scene {
      position: relative;
      width: min(100vw, 2100px);
      aspect-ratio: 21 / 9;
      overflow: hidden;
      isolation: isolate;
      background: transparent;
    }

    .art {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    /*
      These soft highlights stay clipped to the cloud silhouettes.
      They move across the ASCII texture rather than shifting the artwork,
      preserving the original pixel composition.
    */
    .cloud-sheen {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: .44;
      background:
        linear-gradient(
          108deg,
          transparent 0%,
          rgba(220, 231, 245, 0) 34%,
          rgba(220, 231, 245, .18) 49%,
          rgba(220, 231, 245, .04) 55%,
          transparent 70%
        );
      background-size: 260% 100%;
      animation: cloud-sheen 68s ease-in-out infinite alternate;
    }

    .cloud-sheen.left {
      left: 0;
      top: 37%;
      width: 47%;
      height: 20%;
      clip-path: polygon(
        0 84%, 4% 70%, 7% 54%, 11% 48%, 14% 27%,
        19% 34%, 23% 10%, 29% 0, 34% 13%, 39% 28%,
        44% 48%, 51% 66%, 60% 79%, 100% 88%,
        100% 100%, 0 100%
      );
    }

    .cloud-sheen.right {
      left: 62%;
      top: 34%;
      width: 38%;
      height: 20%;
      opacity: .38;
      animation-duration: 79s;
      animation-delay: -21s;
      clip-path: polygon(
        0 80%, 5% 57%, 11% 42%, 17% 15%, 23% 3%,
        31% 15%, 38% 0, 45% 7%, 52% 25%,
        61% 34%, 70% 49%, 80% 65%, 91% 77%,
        100% 84%, 100% 100%, 0 100%
      );
    }

    @keyframes cloud-sheen {
      from {
        background-position: 0% 50%;
        transform: translateX(-.25%);
      }
      to {
        background-position: 100% 50%;
        transform: translateX(.25%);
      }
    }

    .star {
      position: absolute;
      z-index: 3;
      color: #cbd5e3;
      font: 9px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      opacity: .08;
      pointer-events: none;
      animation: star-breathe 11s ease-in-out infinite;
    }

    .star.one {
      left: 10.5%;
      top: 9%;
      animation-delay: -4s;
    }

    .star.two {
      left: 64%;
      top: 7%;
      font-size: 7px;
      animation-duration: 15s;
      animation-delay: -8s;
    }

    .star.three {
      right: 13%;
      top: 15%;
      font-size: 8px;
      animation-duration: 18s;
      animation-delay: -2s;
    }

    @keyframes star-breathe {
      0%, 100% { opacity: .045; }
      45% { opacity: .16; }
      58% { opacity: .075; }
    }

    .scene-link {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: block;
      color: transparent;
      text-decoration: none;
    }

    .scene-link:focus-visible {
      outline: 1px solid rgba(220, 231, 245, .55);
      outline-offset: -4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud-sheen,
      .star {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Slowly animated ASCII pixel-art landscape">
    <img class="art" src="./assets/header-ascii.svg" alt="ASCII landscape with clouds and a distant horizon">
    <div class="cloud-sheen left" aria-hidden="true"></div>
    <div class="cloud-sheen right" aria-hidden="true"></div>
    <span class="star one" aria-hidden="true">✧</span>
    <span class="star two" aria-hidden="true">✦</span>
    <span class="star three" aria-hidden="true">✧</span>
    <a class="scene-link" href="https://github.com/GianT404/GianT404" aria-label="Back to GianT404's GitHub profile"></a>
  </main>
</body>
</html>
