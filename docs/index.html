<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="A slowly animated 21:9 ASCII pixel-art landscape.">
  <title>GianT404 — Living ASCII Landscape</title>
  <style>
    :root { color-scheme: dark; background: #101114; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #101114;
    }
    .scene {
      position: relative;
      width: min(100vw, 2100px);
      aspect-ratio: 21 / 9;
      overflow: hidden;
      isolation: isolate;
      background: transparent;
    }
    .art {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }
    .star {
      position: absolute;
      z-index: 2;
      color: #cbd5e3;
      font: 9px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      opacity: .07;
      pointer-events: none;
      animation: star-breathe 13s ease-in-out infinite;
    }
    .star.one { left: 10.5%; top: 9%; animation-delay: -4s; }
    .star.two { left: 64%; top: 7%; font-size: 7px; animation-duration: 17s; animation-delay: -8s; }
    .star.three { right: 13%; top: 15%; font-size: 8px; animation-duration: 19s; animation-delay: -2s; }
    @keyframes star-breathe {
      0%, 100% { opacity: .035; }
      48% { opacity: .14; }
      56% { opacity: .07; }
    }
    .scene-link {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: block;
      text-decoration: none;
    }
    .scene-link:focus-visible {
      outline: 1px solid rgba(220, 231, 245, .55);
      outline-offset: -4px;
    }
    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Slowly animated ASCII pixel-art landscape">
    <img class="art" src="./assets/header-ascii-animated.svg" alt="ASCII landscape with slowly drifting clouds over a distant horizon">
    <span class="star one" aria-hidden="true">✧</span>
    <span class="star two" aria-hidden="true">✦</span>
    <span class="star three" aria-hidden="true">✧</span>
    <a class="scene-link" href="https://github.com/GianT404/GianT404" aria-label="Back to GianT404's GitHub profile"></a>
  </main>
</body>
</html>
